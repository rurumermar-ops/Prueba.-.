<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Transacción - Roblox Premium Store</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Mismo fondo profesional con capa oscura */
            background-image: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), url('background imgg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f1f5f9;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .checkout-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .badge-visual {
            height: 160px;
            background: rgba(15, 23, 42, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .checkout-content {
            padding: 35px;
        }

        .volver-btn {
            display: inline-block;
            margin-bottom: 25px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .volver-btn:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .descripcion {
            font-size: 1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .precio-seccion {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .precio-label {
            font-size: 1.05rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .precio-contenedor {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .robux-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .precio-valor {
            font-size: 2rem;
            font-weight: 700;
            color: #f59e0b;
        }

        /* Botón estilo enlace Discord profesional */
        .btn-comprar {
            display: block;
            width: 100%;
            background-color: #5865F2; /* Color oficial Blurple de Discord */
            color: white;
            text-align: center;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
        }

        .btn-comprar:hover {
            background-color: #4752C4;
        }

        .btn-comprar:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="checkout-card">
        <div id="productoVisual" class="badge-visual">📦</div>
        
        <div class="checkout-content">
            <a href="index.html" class="volver-btn">&larr; Volver al catálogo</a>
            <h1 id="productoNombre">Cargando artículo...</h1>
            <p id="productoDescripcion" class="descripcion">Cargando especificaciones...</p>
            
            <div class="precio-seccion">
                <span class="precio-label">Precio del Ítem:</span>
                <div class="precio-contenedor">
                    <img src="asd.png" alt="Robux" class="robux-icon">
                    <span id="productoPrecio" class="precio-valor">0</span>
                </div>
            </div>
            
            <a id="enlaceDiscord" href="https://discord.gg/Q6bubRfbYX" target="_blank" class="btn-comprar">
                Pedir por Discord
            </a>
        </div>
    </div>

    <script>
        const nombre = localStorage.getItem('producto_nombre');
        const precio = localStorage.getItem('producto_precio');
        const descripcion = localStorage.getItem('producto_descripcion');

        if (nombre && precio) {
            document.getElementById('productoNombre').innerText = nombre;
            document.getElementById('productoPrecio').innerText = precio;
            document.getElementById('productoDescripcion').innerText = descripcion;
            
            const visualDiv = document.getElementById('productoVisual');
            if (nombre.includes('Radio')) visualDiv.innerText = '📻';
            else if (nombre.includes('VIP')) visualDiv.innerText = '✨';
            else if (nombre.includes('Ninja')) visualDiv.innerText = '🥷';
            else if (nombre.includes('Dominus')) visualDiv.innerText = '👑';
            else visualDiv.innerText = '📦';
        }
    </script>
</body>
</html>
